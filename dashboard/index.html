<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - AP Learning</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <style>
    /* ========== CSS Reset & Variables ========== */
    :root {
      --bg: #0a0f1c;
      --card-bg: #111827;
      --primary: #3b82f6;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --border: #1f2937;
      --border-light: #374151;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }

    /* ========== Top Navigation ========== */
    .topnav {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topnav-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      height: 60px;
      gap: 2rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      background: var(--primary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.9rem;
    }
    .brand-title { font-weight: 600; font-size: 1rem; }

    .nav-links { display: flex; gap: 0.25rem; margin-left: auto; }
    .nav-links a {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 0.9rem;
      transition: all 0.15s;
    }
    .nav-links a:hover { color: var(--text); background: var(--border); }
    .nav-links a.active { color: var(--text); background: var(--border-light); }

    .user-avatar {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.85rem;
      margin-left: 1rem;
    }

    /* ========== Main Container ========== */
    .dashboard {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* ========== Profile Panel ========== */
    .profile-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 1.5rem;
      align-items: center;
      margin-bottom: 2rem;
    }

    .avatar-circle {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.5rem;
    }

    .profile-info h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
    .profile-info .bio { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.5rem; }
    .profile-info .goal { font-size: 0.85rem; color: var(--primary); }

    .profile-stats { display: flex; gap: 2rem; }
    .stat { text-align: center; }
    .stat .value { font-size: 1.75rem; font-weight: 700; color: var(--primary); }
    .stat .label { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem; }

    /* ========== Section Headers ========== */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .section-title { font-size: 1.1rem; font-weight: 600; }
    .section-link { font-size: 0.85rem; color: var(--primary); }

    /* ========== Subject Cards Grid ========== */
    .subjects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .subject-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .subject-card:hover { border-color: var(--primary); transform: translateY(-2px); }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }
    .card-title { font-weight: 600; font-size: 1rem; }
    .card-countdown {
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      background: var(--border);
      color: var(--text-muted);
    }
    .card-countdown.soon { background: #ef444420; color: var(--danger); }

    /* Prediction Bar */
    .card-prediction { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
    .prediction-score {
      font-size: 2.5rem;
      font-weight: 700;
      line-height: 1;
    }
    .prediction-score.score-5 { color: var(--success); }
    .prediction-score.score-4 { color: #22c55e; }
    .prediction-score.score-3 { color: var(--warning); }
    .prediction-score.score-2 { color: #f97316; }
    .prediction-score.score-1 { color: var(--danger); }

    .prob-bar {
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 0.25rem;
    }
    .prob-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
    .prob-text { font-size: 0.75rem; color: var(--text-muted); }

    /* Score Items */
    .card-scores { display: flex; gap: 1.5rem; margin-bottom: 1rem; }
    .score-item { display: flex; flex-direction: column; gap: 0.25rem; }
    .score-item-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
    .score-item-value { font-size: 0.9rem; font-weight: 600; }

    /* Mastery Blocks */
    .card-mastery { display: flex; gap: 0.35rem; }
    .mastery-block {
      flex: 1;
      height: 24px;
      background: var(--border);
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }
    .mastery-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--danger);
      transition: height 0.3s;
    }
    .mastery-block[data-level="full"] .mastery-fill { background: var(--success); }
    .mastery-block[data-level="high"] .mastery-fill { background: #3b82f6; }
    .mastery-block[data-level="mid"] .mastery-fill { background: var(--warning); }

    .crown-badge {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 8px;
      height: 8px;
      background: #fbbf24;
      border-radius: 50%;
    }

    .trained-badge {
      position: absolute;
      bottom: 2px;
      right: 2px;
      font-size: 10px;
      line-height: 1;
    }

    .mastery-block[data-trained="true"] {
      border: 2px solid #22c55e;
    }

    /* ========== Unit Detail Panel ========== */
    .unit-detail {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .unit-detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .unit-detail-header h2 { font-size: 1.25rem; }
    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
    }
    .close-btn:hover { background: var(--border); color: var(--text); }

    .units-grid { display: flex; flex-direction: column; gap: 0.75rem; }
    .unit-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem;
      background: var(--bg);
      border-radius: 8px;
    }
    .unit-name { flex: 1; font-size: 0.9rem; }
    .unit-bar {
      width: 120px;
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }
    .unit-fill { height: 100%; border-radius: 4px; }
    .unit-fill.high { background: var(--success); }
    .unit-fill.mid { background: var(--warning); }
    .unit-fill.low { background: var(--danger); }
    .unit-pct { width: 45px; text-align: right; font-size: 0.85rem; color: var(--text-muted); }
    .unit-badge {
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      background: #fbbf2420;
      color: #fbbf24;
    }
    .detail-section {
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    .detail-section-title {
      margin-bottom: 0.75rem;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .activity-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .activity-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem;
      border-radius: 8px;
      background: var(--bg);
    }
    .activity-item-name {
      font-size: 0.9rem;
    }
    .activity-item-meta {
      margin-top: 0.2rem;
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    .activity-item-pct {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary);
      white-space: nowrap;
    }

    /* ========== Quick Actions ========== */
    .quick-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }
    .action-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .action-card:hover { border-color: var(--primary); transform: translateY(-2px); }
    .action-icon { font-size: 2rem; margin-bottom: 0.5rem; }
    .action-title { font-weight: 600; margin-bottom: 0.25rem; }
    .action-desc { font-size: 0.8rem; color: var(--text-muted); }

    /* ========== Loading ========== */
    .loading { text-align: center; padding: 3rem; color: var(--text-muted); }

    /* ========== Responsive ========== */
    @media (max-width: 768px) {
      .profile-panel { grid-template-columns: 1fr; text-align: center; }
      .profile-stats { justify-content: center; }
      .quick-actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- Top Navigation -->
  <header class="topnav">
    <div class="topnav-inner">
      <a href="../" class="brand">
        <span class="brand-mark">AP</span>
        <span class="brand-title">AP Learning</span>
      </a>
      <nav class="nav-links">
        <a href="../">首页</a>
        <a href="../mock/">套题模考</a>
        <a href="../training/">专项训练</a>
        <a href="./" class="active">Dashboard</a>
      </nav>
      <div class="user-avatar">OC</div>
    </div>
  </header>

  <!-- Dashboard -->
  <main class="dashboard">
    <!-- Profile Panel -->
    <section class="profile-panel">
      <div class="avatar-circle">OC</div>
      <div class="profile-info">
        <h1 id="user-name">Olivia Chen</h1>
        <p class="bio" id="user-bio">自学 AP 考生</p>
        <p class="goal" id="user-goal">目标：AP 2026 - 8门5分</p>
      </div>
      <div class="profile-stats">
        <div class="stat">
          <div class="value" id="exam-count">1</div>
          <div class="label">已报科目</div>
        </div>
        <div class="stat">
          <div class="value" id="avg-prob">--</div>
          <div class="label">五分概率</div>
        </div>
        <div class="stat">
          <div class="value" id="days-left">--</div>
          <div class="label">距考试</div>
        </div>
      </div>
    </section>

    <!-- Subject Cards -->
    <div class="section-header">
      <span class="section-title">我的科目</span>
      <a href="../mock/" class="section-link">查看全部 →</a>
    </div>
    <section class="subjects-grid" id="subjects-grid">
      <div class="loading">加载中...</div>
    </section>

    <!-- Unit Detail (Hidden by default) -->
    <section class="unit-detail" id="unit-detail" style="display: none;">
      <div class="unit-detail-header">
        <h2 id="unit-detail-title">Calculus BC - Units</h2>
        <button class="close-btn" id="close-unit-btn">✕</button>
      </div>
      <div class="units-grid" id="units-grid"></div>
    </section>
  </main>

  <script>
    // ========== Dashboard Data ==========
    let dashboardData = null;

    const CALC_BC_DASHBOARD_STATE_KEY = 'mokaoai-local-mock:1902622411800285184';
    const TRAINING_COMPLETIONS_KEY = 'mokaoai-training-completions';

    function loadTrainingCompletions() {
      try {
        const raw = localStorage.getItem(TRAINING_COMPLETIONS_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }
    const CALC_BC_MAPPING_PATH = '../v2/data/calc-bc-2018-intl/question-branch-mapping.json';
    const CALC_BC_CONTRACT_PATH = '../v2/data/contracts/ap-calculus-bc-trunk-contract.json';
    const CALC_BC_DASHBOARD_DEFAULT_UNITS = [
      { name: 'Limits and Continuity', mastery: 85, crown: true },
      { name: 'Differentiation', mastery: 72, crown: false },
      { name: 'Applications of Derivatives', mastery: 65, crown: false },
      { name: 'Integration', mastery: 58, crown: false },
      { name: 'Applications of Integration', mastery: 45, crown: false },
      { name: 'Differential Equations', mastery: 30, crown: false },
      { name: 'Parametric & Polar', mastery: 20, crown: false },
      { name: 'Infinite Sequences', mastery: 15, crown: false }
    ];
    const CALC_BC_DASHBOARD_MAX_BLOCKS = 8;
    const CALC_BC_DASHBOARD_RECENT_LIMIT = 3;

    // 加载进度数据
    function loadProgress() {
      try {
        const raw = localStorage.getItem('ap-learning-progress');
        return raw ? JSON.parse(raw) : { exams: 0, questions: 0, accuracy: 0, subjects: {} };
      } catch (e) {
        return { exams: 0, questions: 0, accuracy: 0, subjects: {} };
      }
    }

    // 加载做题记录
    function loadSessions() {
      const sessions = [];
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith('ap-learning-session:')) {
          try {
            const data = JSON.parse(localStorage.getItem(key));
            if (data) sessions.push(data);
          } catch (e) {}
        }
      }
      return sessions;
    }

    function getCalcBcDefaultSubject(progress) {
      return {
        id: 'calc-bc',
        name: 'AP Calculus BC',
        examDate: '2026-05-11',
        predictedScore: 4,
        fiveProbability: progress.subjects?.calculus_bc
          ? Math.round((progress.subjects.calculus_bc.correct / progress.subjects.calculus_bc.questions) * 100)
          : 72,
        mcqScore: progress.subjects?.calculus_bc?.correct || 0,
        mcqTotal: progress.subjects?.calculus_bc?.questions || 45,
        units: CALC_BC_DASHBOARD_DEFAULT_UNITS.map((unit) => ({ ...unit })),
        recentActivity: [],
        dashboardSource: 'static'
      };
    }

    function getStaticSubjectData(progress) {
      return [
        getCalcBcDefaultSubject(progress),
        {
          id: 'stats',
          name: 'AP Statistics',
          examDate: '2026-05-14',
          predictedScore: 3,
          fiveProbability: 45,
          mcqScore: 0,
          mcqTotal: 40,
          units: [
            { name: 'Exploring Data', mastery: 60, crown: false },
            { name: 'Sampling & Experiment', mastery: 40, crown: false },
            { name: 'Probability', mastery: 25, crown: false },
            { name: 'Inference', mastery: 10, crown: false }
          ],
          recentActivity: [],
          dashboardSource: 'static'
        }
      ];
    }

    function loadCalcBcDashboardState() {
      try {
        const raw = localStorage.getItem(CALC_BC_DASHBOARD_STATE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (error) {
        console.warn('Failed to parse Cal BC dashboard state', error);
        return null;
      }
    }

    async function loadCalcBcDashboardResources() {
      if (dashboardData) {
        return dashboardData;
      }

      try {
        const [mappingResponse, contractResponse] = await Promise.all([
          fetch(CALC_BC_MAPPING_PATH),
          fetch(CALC_BC_CONTRACT_PATH)
        ]);

        if (!mappingResponse.ok || !contractResponse.ok) {
          console.warn('Cal BC dashboard resources unavailable', {
            mappingStatus: mappingResponse.status,
            contractStatus: contractResponse.status
          });
          dashboardData = null;
          return null;
        }

        const [mapping, contract] = await Promise.all([
          mappingResponse.json(),
          contractResponse.json()
        ]);

        dashboardData = { mapping, contract };
        return dashboardData;
      } catch (error) {
        console.warn('Failed to load Cal BC dashboard resources', error);
        dashboardData = null;
        return null;
      }
    }

    function flattenCalcBcAttemptQuestions(attemptState) {
      if (!attemptState || !Array.isArray(attemptState.sectionStates)) {
        return [];
      }

      let sequenceInExam = 0;
      return attemptState.sectionStates.flatMap((sectionState) => {
        const answers = Array.isArray(sectionState?.answers) ? sectionState.answers : [];
        return answers.map((answer) => {
          sequenceInExam += 1;
          return {
            sequenceInExam,
            answer,
            answered: isDashboardAnswerFilled(answer)
          };
        });
      });
    }

    function isDashboardAnswerFilled(answer) {
      if (Array.isArray(answer)) {
        return answer.length > 0;
      }
      if (answer && typeof answer === 'object') {
        return Object.values(answer).some((value) => isDashboardAnswerFilled(value));
      }
      return String(answer || '').trim().length > 0;
    }

    function normalizeCoveragePercent(rate) {
      return Math.max(0, Math.min(100, Math.round(rate * 100)));
    }

    function compareDashboardCoverage(left, right) {
      if (right.mastery !== left.mastery) {
        return right.mastery - left.mastery;
      }
      if ((right.answeredCount || 0) !== (left.answeredCount || 0)) {
        return (right.answeredCount || 0) - (left.answeredCount || 0);
      }
      if ((right.sequenceOrder || 0) !== (left.sequenceOrder || 0)) {
        return (right.sequenceOrder || 0) - (left.sequenceOrder || 0);
      }
      return String(left.name || '').localeCompare(String(right.name || ''));
    }

    function buildCalcBcDashboardOverlay(attemptState, resources, trainingCompletions) {
      // Build trained branch set from completions
      const trainedBranchIds = new Set();
      if (Array.isArray(trainingCompletions)) {
        trainingCompletions.forEach((record) => {
          if (record.branchId) trainedBranchIds.add(record.branchId);
        });
      }

      if (!attemptState || !resources?.mapping || !resources?.contract) {
        return null;
      }

      const questionRecords = flattenCalcBcAttemptQuestions(attemptState);
      if (!questionRecords.length) {
        return null;
      }

      const mappingEntries = Array.isArray(resources.mapping?.mappings)
        ? resources.mapping.mappings
        : [];
      const branchById = new Map((resources.contract?.branches || []).map((branch) => [branch.id, branch]));
      const questionBySequence = new Map(questionRecords.map((record) => [record.sequenceInExam, record]));

      const branchBuckets = new Map();
      mappingEntries.forEach((mappingEntry) => {
        const branchId = mappingEntry.branchId || (Array.isArray(mappingEntry.branchIds) ? mappingEntry.branchIds[0] : '');
        if (!branchId) {
          return;
        }
        const record = questionBySequence.get(Number(mappingEntry.sequenceInExam));
        if (!record) {
          return;
        }
        if (!branchBuckets.has(branchId)) {
          const branchMeta = branchById.get(branchId) || {};
          branchBuckets.set(branchId, {
            id: branchId,
            name: branchMeta.name || branchId,
            trunkId: branchMeta.trunkId || mappingEntry.trunkId || '',
            mappedCount: 0,
            answeredCount: 0,
            latestSequence: 0
          });
        }
        const bucket = branchBuckets.get(branchId);
        bucket.mappedCount += 1;
        if (record.answered) {
          bucket.answeredCount += 1;
        }
        bucket.latestSequence = Math.max(bucket.latestSequence, record.sequenceInExam);
      });

      const branchCoverage = [...branchBuckets.values()]
        .map((bucket) => ({
          ...bucket,
          mastery: normalizeCoveragePercent(bucket.mappedCount ? bucket.answeredCount / bucket.mappedCount : 0),
          crown: bucket.mappedCount > 0 && bucket.answeredCount === bucket.mappedCount,
          sequenceOrder: bucket.latestSequence
        }))
        .filter((bucket) => bucket.mappedCount > 0);

      if (!branchCoverage.length) {
        return null;
      }

      const masteryBlocks = [...branchCoverage]
        .sort(compareDashboardCoverage)
        .slice(0, CALC_BC_DASHBOARD_MAX_BLOCKS)
        .map(({ id, name, mastery, crown, answeredCount, mappedCount }) => ({
          id,
          name,
          mastery,
          crown,
          trained: trainedBranchIds.has(id),
          answeredCount,
          mappedCount
        }));

      const recentActivity = [...branchCoverage]
        .filter((bucket) => bucket.answeredCount > 0)
        .sort((left, right) => right.latestSequence - left.latestSequence)
        .slice(0, CALC_BC_DASHBOARD_RECENT_LIMIT)
        .map(({ id, name, mastery, answeredCount, mappedCount }) => ({
          id,
          name,
          mastery,
          trained: trainedBranchIds.has(id),
          answeredCount,
          mappedCount
        }));

      return {
        units: masteryBlocks,
        recentActivity,
        mappedBranchCount: branchCoverage.length
      };
    }

    async function getSubjectData() {
      const progress = loadProgress();
      const subjects = getStaticSubjectData(progress);
      const calcBcSubject = subjects.find((subject) => subject.id === 'calc-bc');
      if (!calcBcSubject) {
        return subjects;
      }

      const [attemptState, resources, trainingCompletions] = await Promise.all([
        Promise.resolve(loadCalcBcDashboardState()),
        loadCalcBcDashboardResources(),
        Promise.resolve(loadTrainingCompletions())
      ]);
      const overlay = buildCalcBcDashboardOverlay(attemptState, resources, trainingCompletions);

      if (overlay) {
        calcBcSubject.units = overlay.units;
        calcBcSubject.recentActivity = overlay.recentActivity;
        calcBcSubject.dashboardSource = 'local';
      }

      return subjects;
    }

    function renderRecentActivity(subject) {
      if (!Array.isArray(subject.recentActivity) || !subject.recentActivity.length) {
        return '';
      }

      return `
        <div class="detail-section">
          <div class="detail-section-title">Recent branch activity</div>
          <div class="activity-list">
            ${subject.recentActivity.map((item) => `
              <div class="activity-item">
                <div>
                  <div class="activity-item-name">${item.name}${item.trained ? ' ✅' : ''}</div>
                  <div class="activity-item-meta">${item.answeredCount}/${item.mappedCount} mapped questions covered${item.trained ? ' · trained' : ''}</div>
                </div>
                <div class="activity-item-pct">${item.mastery}%</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // ========== Render ==========
    async function renderDashboard() {
      const subjects = await getSubjectData();
      const grid = document.getElementById('subjects-grid');

      grid.innerHTML = subjects.map(subject => {
        const today = new Date();
        const examDate = new Date(subject.examDate);
        const daysLeft = Math.ceil((examDate - today) / (1000 * 60 * 60 * 24));
        const countdownClass = daysLeft <= 30 ? 'soon' : '';

        let masteryBlocks = subject.units.slice(0, 8).map(unit => {
          let level = 'low';
          if (unit.mastery >= 80) level = 'full';
          else if (unit.mastery >= 60) level = 'high';
          else if (unit.mastery >= 40) level = 'mid';

          return `
            <div class="mastery-block" data-level="${level}" data-trained="${unit.trained ? 'true' : 'false'}" title="${unit.name}: ${unit.mastery}%${unit.trained ? ' ✅ trained' : ''}">
              <div class="mastery-fill" style="height: ${unit.mastery}%"></div>
              ${unit.crown ? '<div class="crown-badge"></div>' : ''}
              ${unit.trained ? '<div class="trained-badge">✅</div>' : ''}
            </div>
          `;
        }).join('');

        return `
          <div class="subject-card" onclick="toggleUnitDetail('${subject.id}')">
            <div class="card-header">
              <span class="card-title">${subject.name}</span>
              <span class="card-countdown ${countdownClass}">
                ${daysLeft > 0 ? `${daysLeft} 天后` : '已结束'}
              </span>
            </div>

            <div class="card-prediction">
              <div class="prediction-score score-${subject.predictedScore}">${subject.predictedScore}</div>
              <div>
                <div class="prob-bar">
                  <div class="prob-fill" style="width: ${subject.fiveProbability}%; background: ${
                    subject.fiveProbability >= 80 ? '#22c55e' :
                    subject.fiveProbability >= 60 ? '#3b82f6' :
                    subject.fiveProbability >= 40 ? '#f59e0b' : '#ef4444'
                  }"></div>
                </div>
                <div class="prob-text">五分概率: ${subject.fiveProbability}%</div>
              </div>
            </div>

            <div class="card-scores">
              <div class="score-item">
                <span class="score-item-label">MCQ</span>
                <span class="score-item-value">${subject.mcqScore}/${subject.mcqTotal}</span>
              </div>
              <div class="score-item">
                <span class="score-item-label">FRQ</span>
                <span class="score-item-value">--/6</span>
              </div>
            </div>

            <div class="card-mastery">${masteryBlocks}</div>
          </div>
        `;
      }).join('');

      // Update profile stats
      const avgProb = Math.round(subjects.reduce((sum, s) => sum + s.fiveProbability, 0) / subjects.length);
      document.getElementById('avg-prob').textContent = avgProb + '%';
      document.getElementById('exam-count').textContent = subjects.length;
      document.getElementById('days-left').textContent = Math.min(...subjects.map(s => {
        const d = new Date(s.examDate);
        return Math.ceil((d - new Date()) / (1000 * 60 * 60 * 24));
      }));
    }

    // ========== Unit Detail ==========
    async function toggleUnitDetail(subjectId) {
      const subjects = await getSubjectData();
      const subject = subjects.find(s => s.id === subjectId);
      if (!subject) return;

      const detail = document.getElementById('unit-detail');
      const unitsGrid = document.getElementById('units-grid');
      const title = document.getElementById('unit-detail-title');

      title.textContent = `${subject.name} - Units`;
      unitsGrid.innerHTML = `
        ${subject.units.map(unit => {
          const level = unit.mastery >= 60 ? 'high' : unit.mastery >= 40 ? 'mid' : 'low';
          const coverageMeta = Number.isFinite(unit.answeredCount) && Number.isFinite(unit.mappedCount)
            ? `<div class="activity-item-meta">${unit.answeredCount}/${unit.mappedCount} mapped questions covered</div>`
            : '';
          return `
            <div class="unit-row">
              <div class="unit-name">
                <div>${unit.name}</div>
                ${coverageMeta}
              </div>
              <div class="unit-bar">
                <div class="unit-fill ${level}" style="width: ${unit.mastery}%"></div>
              </div>
              <span class="unit-pct">${unit.mastery}%</span>
              ${unit.crown ? '<span class="unit-badge">👑</span>' : ''}
              ${unit.trained ? '<span class="unit-badge" title="Trained">✅</span>' : ''}
            </div>
          `;
        }).join('')}
        ${renderRecentActivity(subject)}
      `;

      detail.style.display = 'block';
      detail.scrollIntoView({ behavior: 'smooth' });
    }

    document.getElementById('close-unit-btn').addEventListener('click', () => {
      document.getElementById('unit-detail').style.display = 'none';
    });

    // ========== Init ==========
    document.addEventListener('DOMContentLoaded', () => {
      renderDashboard();
    });
  </script>
</body>
</html>
